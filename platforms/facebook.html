<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Live — GoLive</title>
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/facebook.css" />
  <!--
    Facebook Live look for GoLive Studio. Built to the spec in
    platforms/facebook.spec.md. Owns only: this file,
    assets/js/platforms/facebook.js, assets/css/facebook.css.
    Comment data comes from the shared chat bank (GoLive.chat) via an
    adapter in facebook.js; a local pool is used until the bank ships.
  -->
</head>
<body class="fb">
  <main class="fb-stage">
    <!-- Live webcam feed -->
    <video class="fb-video" data-camera autoplay muted playsinline></video>
    <div class="fb-camera-error" data-camera-error hidden>
      <span>Camera unavailable. Allow camera access and reload.</span>
    </div>

    <!-- Top-left live status -->
    <div class="fb-status">
      <span class="fb-live-pill">
        <span class="fb-live-dot"></span>LIVE
      </span>
      <span class="fb-viewers">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="fb-eye">
          <path d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7z"
                fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </svg>
        <span data-viewers>0</span>
      </span>
    </div>

    <!-- Top identity bar -->
    <header class="fb-topbar">
      <div class="fb-avatar" data-avatar data-avatar-for="streamer">S</div>
      <div class="fb-ident">
        <strong class="fb-name" data-streamer>Streamer</strong>
        <span class="fb-sub">
          <span data-username>@username</span>
          <span class="fb-dot-sep">·</span>
          started <span data-timer>00:00</span>
        </span>
      </div>
      <button type="button" class="fb-follow" data-follow>
        <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round"/>
        </svg>
        Follow
      </button>
    </header>

    <!-- Live comments -->
    <section class="fb-comments" aria-label="Live comments">
      <div class="fb-comments-mask"></div>
      <ul class="fb-comment-list" data-comments></ul>
    </section>

    <!-- Floating reactions rise here -->
    <div class="fb-reaction-lane" data-reaction-lane aria-hidden="true"></div>

    <!-- Composer + action bar -->
    <footer class="fb-bottom">
      <form class="fb-composer" data-composer>
        <div class="fb-avatar fb-avatar--sm" data-avatar data-avatar-for="user">U</div>
        <input type="text" class="fb-composer-input" data-comment-input
               autocomplete="off" placeholder="Comment as @you" maxlength="140" />
        <button type="submit" class="fb-send" aria-label="Send comment">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
            <path d="M4 12l16-8-6 8 6 8-16-8z" fill="currentColor"/>
          </svg>
        </button>
      </form>

      <div class="fb-actionbar">
        <div class="fb-like-wrap">
          <div class="fb-reaction-picker" data-picker role="menu" aria-label="Pick a reaction">
            <button type="button" data-reaction="👍" title="Like">👍</button>
            <button type="button" data-reaction="❤️" title="Love">❤️</button>
            <button type="button" data-reaction="😆" title="Haha">😆</button>
            <button type="button" data-reaction="😮" title="Wow">😮</button>
            <button type="button" data-reaction="😢" title="Sad">😢</button>
            <button type="button" data-reaction="😡" title="Angry">😡</button>
          </div>
          <button type="button" class="fb-action" data-like aria-haspopup="true">
            <span class="fb-action-emoji" data-like-emoji>👍</span>
            <span data-like-label>Like</span>
          </button>
        </div>
        <button type="button" class="fb-action" data-comment-focus>
          <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
            <path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"
                  fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
          Comment
        </button>
        <button type="button" class="fb-action" data-share>
          <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
            <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v13M7 8l5-5 5 5"
                  fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Share
        </button>
      </div>
    </footer>
  </main>

  <script src="../assets/js/platforms.js"></script>
  <script src="../assets/js/stream-session.js"></script>
  <script src="../assets/js/platforms/facebook.js"></script>
</body>
</html>
