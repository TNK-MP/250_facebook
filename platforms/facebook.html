<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Live — GoLive</title>
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/stream-stub.css" />
  <!--
    ============================================================
    Facebook Live — BUILD YOUR PLATFORM LOOK HERE
    ------------------------------------------------------------
    This is a working starter: the camera turns on and the
    username / streamer name are wired up. Your job is to make
    everything below LOOK like Facebook Live.

    You own these files ONLY (no merge conflicts with others):
      platforms/facebook.html
      assets/js/platforms/facebook.js
      assets/css/facebook.css   (create this and link it above)

    Read data with:  const s = GoLive.session();
                      s.username, s.streamer, s.platform

    See assets/js/platforms/facebook.js for the wiring.
    ============================================================

</head>
<body>
  <main class="stub">
    <header class="stub__bar">
      <span class="dot"></span>
      <span class="stub__live">LIVE</span>
      <span class="stub__platform" data-platform-name>Facebook Live</span>
      <span class="stub__timer" data-timer>00:00</span>
    </header>

    <section class="stub__stage">
      <div class="stub__video-wrap">
        <video data-camera autoplay muted playsinline></video>
        <div class="stub__overlay">
          <strong data-streamer>Streamer</strong>
          <span data-username>@username</span>
        </div>
        <div class="stub__camera-error" data-camera-error>
          Camera unavailable. Allow camera access and reload.
        </div>
      </div>
    </section>

    <footer class="stub__todo">
      TODO: replace this placeholder with the real Facebook Live interface —
      edit <code>platforms/facebook.html</code> and <code>assets/css/facebook.css</code>.
    </footer>
  </main>

  <script src="../assets/js/platforms.js"></script>
  <script src="../assets/js/stream-session.js"></script>
  <script src="../assets/js/platforms/facebook.js"></script>
</body>
</html>
